<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vet Doctor | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow sticky-top mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-warning" href="{% url 'admin_panel:dashboard' %}">
            <i class="fa-solid fa-shield-dog me-2"></i>Admin Panel
        </a>
        <div class="d-flex align-items-center gap-2">
            <a href="{% url 'admin_panel:dashboard' %}" class="btn btn-outline-warning btn-sm rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
            <a href="{% url 'customer:index' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-house me-1"></i> Site Home
            </a>
        </div>
    </div>
    </nav>
    <div class="container py-5">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-user-doctor text-warning me-2"></i>Add Vet Doctor</h4>
                        <a href="{% url 'admin_panel:dashboard' %}" class="btn btn-outline-secondary btn-sm rounded-pill">Back</a>
                    </div>
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger rounded-3">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="p-3 bg-light rounded-3 mb-3 border">
                            <h6 class="fw-bold text-primary mb-2"><i class="fa-solid fa-key me-1"></i> Doctor Login Account</h6>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="e.g. dr_rahul" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="doctor@gmail.com" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Assign Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Password" required>
                            </div>
                        </div>

                        <h6 class="fw-bold text-dark mb-2"><i class="fa-solid fa-id-card me-1"></i> Profile Details</h6>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Specialization</label>
                            <input type="text" name="specialization" class="form-control" placeholder="e.g. Canine Specialist" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Qualification</label>
                            <input type="text" name="qualification" class="form-control" placeholder="e.g. BVSc & AH" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">District</label>
                                <input type="text" name="district" class="form-control" placeholder="e.g. Kozhikode" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Consultation Fee (₹)</label>
                                <input type="number" name="consultation_fee" class="form-control" placeholder="e.g. 500" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 rounded-pill fw-bold py-2">Create Doctor</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
