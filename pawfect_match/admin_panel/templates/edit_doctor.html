<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Vet Doctor | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow sticky-top mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-warning" href="{% url 'admin_panel:dashboard' %}">
            <i class="fa-solid fa-shield-dog me-2"></i>Admin Panel
        </a>
        <div class="d-flex align-items-center gap-2">
            <a href="{% url 'admin_panel:dashboard' %}" class="btn btn-outline-warning btn-sm rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
            <a href="{% url 'customer:index' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-house me-1"></i> Site Home
            </a>
        </div>
    </div>
    </nav>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Edit Dr. {{ doctor_profile.user.username }}</h4>
                        <a href="{% url 'admin_panel:dashboard' %}" class="btn btn-outline-secondary btn-sm rounded-pill">Back</a>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Specialization</label>
                            <input type="text" name="specialization" value="{{ doctor_profile.specialization }}" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Qualification</label>
                            <input type="text" name="qualification" value="{{ doctor_profile.qualification }}" class="form-control" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">District</label>
                                <input type="text" name="district" value="{{ doctor_profile.district }}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Consultation Fee (₹)</label>
                                <input type="number" name="consultation_fee" value="{{ doctor_profile.consultation_fee }}" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="is_available" id="availCheck" {% if doctor_profile.is_available %}checked{% endif %}>
                            <label class="form-check-label small fw-bold" for="availCheck">Available for Booking</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2">Update Doctor Details</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
