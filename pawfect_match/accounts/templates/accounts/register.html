<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Pawfect Match</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #2c3e50;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        .card-top-bar {
            background-color: #e67e22;
            height: 10px;
            width: 100%;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px 15px;
            border: 1px solid #dee2e6;
            background-color: #fcfcfc;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #e67e22;
            background-color: #ffffff;
        }
        .btn-create {
            background-color: #e67e22;
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s;
            border: none;
        }
        .btn-create:hover {
            background-color: #d35400;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="card-top-bar"></div>

        <div class="p-4 p-md-5">
            <!-- Header -->
            <div class="text-center mb-4">
                <h4 class="fw-bold text-dark mb-1">Join Pawfect Match 🐾</h4>
                <p class="text-muted small">Create an account to adopt, buy, or care for pets</p>
            </div>

            <!-- Messages Alert -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning py-2 small rounded-3 mb-3">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <!-- Register Form -->
            <form method="POST">
                {% csrf_token %}

                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">
                        <i class="fa-solid fa-user text-warning me-1"></i> Username
                    </label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a unique username" required>
                </div>

                <!-- Email Address -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">
                        <i class="fa-solid fa-envelope text-warning me-1"></i> Email Address
                    </label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">
                        <i class="fa-solid fa-lock text-warning me-1"></i> Password
                    </label>
                    <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
                </div>


                <!-- Address -->
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">
                        <i class="fa-solid fa-location-dot text-warning me-1"></i> Address
                    </label>
                    <input type="text" name="address" class="form-control" placeholder="e.g. Kozhikode, Kerala" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-create w-100 mb-3 shadow-sm">
                    <i class="fa-solid fa-user-plus me-1"></i> Create Account
                </button>

                <!-- Login Link -->
                <div class="text-center">
                    <small class="text-muted">Already have an account? 
                        <a href="{% url 'accounts:login' %}" class="text-warning fw-bold text-decoration-none ms-1">Login here</a>
                    </small>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
