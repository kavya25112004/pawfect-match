<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Pet for Sale or Adoption | Pawfect Match</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Top Bar with Back to Marketplace & Home -->
    <nav class="navbar navbar-dark bg-dark py-3 mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="{% url 'customer:home' %}">
                <i class="fa-solid fa-paw me-2"></i>Pawfect Match
            </a>
            <div class="d-flex gap-2">
                <a href="{% url 'customer:home' %}" class="btn btn-outline-warning btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Marketplace
                </a>
                <a href="{% url 'customer:index' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-house me-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h4 class="fw-bold text-dark mb-4 text-center">
                        <i class="fa-solid fa-plus-circle text-warning me-2"></i>Post Pet for Sale / Adoption
                    </h4>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">🏷️ Pet Name</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g. Mikku" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">⌛ Breed</label>
                                <input type="text" name="breed" class="form-control" placeholder="e.g. Indian Spitz" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">📅 Age (in Months)</label>
                                <input type="number" name="age_in_months" class="form-control" placeholder="e.g. 3" required min="1">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">₹ Price (₹0 for Free Adoption)</label>
                                <input type="number" name="price" step="0.01" class="form-control" placeholder="5000" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">📃 Gender,Description & Health Details</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Gender,health, vaccines, deworming, behavior..." required></textarea>
                        </div>

                        <div class="mb-4">
    <label class="form-label small fw-bold">📸 Upload Pet Photo</label>
    <input type="file" name="image" class="form-control rounded-3 py-2" accept="image/*" required>
</div>
                        <button type="submit" class="btn btn-warning w-100 rounded-pill fw-bold py-2 shadow-sm text-dark fs-5">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i>Publish Pet Listing
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
