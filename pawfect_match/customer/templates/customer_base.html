<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pawfect Match{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm rounded-pill px-3 mb-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Back
            </a>
            <a href="{% url 'customer:index' %}" class="btn btn-outline-primary btn-sm rounded-pill px-3 mb-3 ms-1">
                <i class="fa-solid fa-house me-1"></i> Home
            </a>
            <a class="navbar-brand fw-bold" href="{% url 'customer:home' %}">🐾 Pawfect Match</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'customer:home' %}">Home / Marketplace</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'customer:add_dog' %}">Post a Dog</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'customer:my_listings' %}">My Listings</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'customer:profile' %}">My Profile</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-danger btn-sm text-white ms-2 px-3" href="{% url 'accounts:logout' %}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
